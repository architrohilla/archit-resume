name: Resume CI

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate required files
        run: |
          test -f index.html
          test -f style.css
          echo "Required resume files exist"

      - name: Install HTML validator
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy

      - name: Validate HTML
        run: |
          tidy -errors -quiet index.html

  generate-pdf:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      - name: Generate PDF
        run: |
          chromium \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --print-to-pdf=resume.pdf \
            file://${{ github.workspace }}/index.html

      - name: Verify PDF
        run: |
          test -f resume.pdf
          ls -lh resume.pdf
          echo "PDF generated successfully"

      - name: Upload resume PDF
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: resume.pdf