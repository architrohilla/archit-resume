name: Resume CI

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show repository files
        run: |
          echo "Files in repository:"
          ls -la

      - name: Validate required files
        run: |
          test -f index.html
          test -f style.css
          echo "Required resume files exist"

      - name: Install HTML validator
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy

      - name: Validate HTML
        run: |
          tidy -errors -quiet index.html

      - name: Validation successful
        run: |
          echo "Resume validation completed successfully"