name: Resume CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate required files
        run: |
          test -f index.html
          test -f style.css
          echo "Required resume files exist"

      - name: Install HTML validator
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy

      - name: Validate HTML
        run: |
          tidy -errors -quiet index.html

  generate-pdf:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      - name: Generate PDF
        run: |
          chromium \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --no-pdf-header-footer \
            --print-to-pdf=resume.pdf \
            file://${{ github.workspace }}/index.html

      - name: Verify PDF
        run: |
          test -f resume.pdf
          ls -lh resume.pdf
          echo "PDF generated successfully"

      - name: Upload resume PDF
        uses: actions/upload-artifact@v6
        with:
          name: resume-pdf
          path: resume.pdf
  
  deploy:
    needs: generate-pdf
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download generated PDF
        uses: actions/download-artifact@v6
        with:
          name: resume-pdf
          path: .

      - name: Verify deployment files
        run: |
          echo "Files being deployed:"
          ls -lah

          test -f index.html
          test -f style.css
          test -f resume.pdf

          echo "All deployment files are present"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4